buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Firebase (Firebase plan Phase 1, RNFB-pinned versions — stack.md):
        // google-services must be applied BEFORE crashlytics in the app
        // module (misorder/mismatch is the classic "No Firebase App
        // '[DEFAULT]'" / "Crashlytics build ID missing" startup crash).
        classpath("com.google.gms:google-services:4.5.0")
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.8")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Pin every Android library to the same NDK the app uses. Libraries that
// don't set their own ndkVersion get AGP's default (r28), whose clang emits
// calls to __cxa_init_primary_exception — a symbol missing from the
// r27-built libc++_shared.so bundled in the react-android AAR
// (facebook/react-native#54886), which crashes with UnsatisfiedLinkError at
// startup (seen with react-native-nitro-geolocation).
subprojects { sub ->
    sub.plugins.withId("com.android.library") {
        def androidExt = sub.extensions.findByName("android")
        if (androidExt != null) {
            androidExt.ndkVersion = rootProject.ext.ndkVersion
        }
    }
}
