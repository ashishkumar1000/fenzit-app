name: iOS release build

# Mirrors android-release.yml: every push to `release` produces a signed
# App Store IPA. The build job runs automatically; the TestFlight upload
# is a separate job gated by the `testflight` environment (required
# reviewer set in GitHub → Settings → Environments), mirroring
# play-production — nothing reaches TestFlight until it is approved.
# Intended flow is main → release via PR, same as Android.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-release-${{ github.ref }}
  # Kept true for android-release.yml parity. Consequence: a new push to
  # `release` cancels a run still waiting on the testflight approval —
  # Android's play-publish waits under the same rule.
  cancel-in-progress: true

jobs:
  ios-release-build:
    name: Archive App Store IPA
    # macos-26 ships Xcode 26 (Apple pairs one major Xcode per macOS release).
    # ASC rejects uploads built with older SDKs: run 45175449322 archived fine
    # on macos-15's Xcode 16.4 (iOS 18.5 SDK) and died at upload with
    # "must be built with the iOS 26 SDK or later" (409 SDK version issue).
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      # fetch-depth: 0 — verify:store scans store-v* tags (same as Android).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # RN 0.87's Xcode build phase ("Bundle React Native code and images")
      # shells out to node from ios/.xcode.env — setup-node puts it in PATH.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # SkillIcon.catalog.test.ts reads the skills icon catalog straight from
      # the fenzit-be migration — same sibling checkout as android-release.yml
      # (pinned to .fenzit-be-ref, two levels up from the checkout dir).
      - name: Check out sibling fenzit-be
        run: |
          : "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE unset}"
          PIN="$(grep -v '^#' "$GITHUB_WORKSPACE/.fenzit-be-ref" | head -1 | tr -d '[:space:]')"
          if [[ ! "$PIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.fenzit-be-ref must contain a 40-hex commit sha (got: '$PIN')"
            exit 1
          fi
          DEST="$GITHUB_WORKSPACE/../../backend/fenzit-be"
          rm -rf "$DEST"
          git init -q "$DEST"
          git -C "$DEST" fetch -q --depth 1 https://github.com/ashishkumar1000/fenzit-be.git "$PIN"
          git -C "$DEST" checkout -q FETCH_HEAD
          echo "fenzit-be pinned at $(git -C "$DEST" rev-parse HEAD)"

      # Same gates as the Android pipeline — PR merges and --no-verify
      # commits reach `release` without ever running the pre-commit hook.
      - name: Tests
        run: bun run test
        env:
          TZ: Asia/Kolkata

      - name: Verify version sync
        run: bun run verify:version

      - name: Verify store version downgrade
        run: bun run verify:store

      # Same gate as android-release.yml: the notes must exist, fit 500
      # chars, and be written for this release. The same file feeds the
      # TestFlight "What to Test" text (single source of truth across
      # platforms); a rebuild of an already-tagged version skips the
      # freshness check.
      - name: Verify What's new notes
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NOTES="release-notes/$VERSION.txt"
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES is missing or empty — write the release notes before releasing"
            exit 1
          fi
          CHARS="$(wc -m < "$NOTES" | tr -d ' ')"
          if [ "$CHARS" -gt 500 ]; then
            echo "::error::$NOTES is $CHARS characters — the shared release-notes limit is 500"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION already tagged — skipping the freshness check on rebuild"
            exit 0
          fi
          # Compare with the newest other notes file (highest version).
          PREV_NOTES="$(ls release-notes/*.txt 2>/dev/null | grep -vx "$NOTES" | sort -V | tail -n 1 || true)"
          if [ -n "$PREV_NOTES" ] && [ "$(cat "$PREV_NOTES")" = "$(cat "$NOTES")" ]; then
            echo "::error::$NOTES is identical to $PREV_NOTES — rewrite it for this release"
            exit 1
          fi

      # Signing uses an App Store Connect API key, NOT checked-in certs:
      # xcodebuild -allowProvisioningUpdates with the key creates/refreshes
      # the App Store distribution profile on the fly. The .p8 lives only
      # in secrets and is written to the runner's build dir, discarded with
      # the job. Role required: Admin or App Manager.
      - name: Write App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.FENZIT_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.FENZIT_ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.FENZIT_ASC_KEY_P8 }}
          ASC_TEAM_ID: ${{ secrets.FENZIT_APPLE_TEAM_ID }}
        run: |
          for v in "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$ASC_KEY_P8" "$ASC_TEAM_ID"; do
            [ -n "$v" ] || { echo "::error::missing secret — need FENZIT_ASC_KEY_ID, FENZIT_ASC_ISSUER_ID, FENZIT_ASC_KEY_P8, FENZIT_APPLE_TEAM_ID"; exit 1; }
          done
          mkdir -p build
          printf '%s' "$ASC_KEY_P8" > "build/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "build/AuthKey_${ASC_KEY_ID}.p8"

      # Podfile.lock pins pod versions — plain `pod install` is reproducible.
      # CocoaPods ships on the macOS runner image.
      - name: Install pods
        working-directory: ios
        run: pod install

      # DEVELOPMENT_TEAM is passed as an override (the project has none
      # checked in) so the same repo builds under any team. The archive
      # bundles the JS via the RN build phase using node from setup-node.
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.FENZIT_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.FENZIT_ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.FENZIT_APPLE_TEAM_ID }}
          # Sentry uploads the JS source map and debug symbols (Release only).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: fenzit
          SENTRY_PROJECT: fenzit-app
        run: |
          set -o pipefail
          # Full log goes to build/archive.log; stdout keeps the tail. On
          # failure print the real error lines — plain `| tail -40` buries
          # them under per-target notes.
          ERROR_RE='error:|ERROR:|No signing|Provisioning|requires a development team|is invalid|ARCHIVE FAILED|The following build commands failed'
          xcodebuild \
            -workspace ios/FenzitApp.xcworkspace \
            -scheme FenzitApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/FenzitApp.xcarchive" \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -authenticationKeyPath "$GITHUB_WORKSPACE/build/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates \
            archive 2>&1 | tee build/archive.log | tail -40 || {
              echo "=== xcodebuild error summary ==="
              grep -nE "$ERROR_RE" build/archive.log | head -80
              echo "=== context around first errors ==="
              # Same pattern as the summary (signing failures often log no
              # lowercase `error:`); start clamped to 1 — the first match
              # can sit within the first lines of an instant failure.
              grep -nE "$ERROR_RE" build/archive.log | head -3 | cut -d: -f1 | while read -r n; do
                sed -n "$((n > 9 ? n - 8 : 1)),$((n + 12))p" build/archive.log
              done
              exit 1
            }

      - name: Export App Store IPA
        env:
          ASC_KEY_ID: ${{ secrets.FENZIT_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.FENZIT_ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.FENZIT_APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/FenzitApp.xcarchive" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/build/ExportOptions.plist" \
            -exportPath "$GITHUB_WORKSPACE/build/ipa" \
            -authenticationKeyPath "$GITHUB_WORKSPACE/build/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates 2>&1 | tee build/export.log | tail -20 || {
              echo "=== export errors ==="
              grep -nE "error:|ERROR:|No signing|Provisioning|is invalid|failed" build/export.log | head -60
              exit 1
            }
          ls -la build/ipa/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error

      # Record-keeping parity with Android: attach the IPA to the same
      # v<version> GitHub Release (the store-signable IPA only installs via
      # TestFlight/App Store — the release asset is an audit artifact).
      # continue-on-error: a flaky gh call must not fail the build job —
      # upload-testflight `needs` this job whole, and the IPA reaching
      # TestFlight matters more than the audit asset.
      - name: Publish GitHub release asset
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          IPA_FILE="$(ls build/ipa/*.ipa | head -1)"
          STAGE="$(mktemp -d)"
          cp "$IPA_FILE" "$STAGE/fenzit-$VERSION.ipa"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$STAGE/fenzit-$VERSION.ipa" --clobber
          elif git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::tag $TAG exists but has no release — delete the tag or bump the version before publishing"
            exit 1
          else
            gh release create "$TAG" "$STAGE/fenzit-$VERSION.ipa" \
              --target "$GITHUB_SHA" --title "Fenzit $VERSION" --generate-notes
          fi

      # TestFlight "What to Test" comes from the same release-notes file the
      # gate above verified — staged as an artifact because the gated upload
      # job has no repo checkout.
      - name: Stage TestFlight changelog
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p build/changelog
          cp "release-notes/$VERSION.txt" build/changelog/whats-new.txt

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v7
        with:
          name: testflight-changelog
          path: build/changelog/whats-new.txt
          if-no-files-found: error

  # TestFlight publish. Runs only after the build job passes, and waits for
  # a required reviewer to approve the `testflight` environment (set in
  # GitHub → Settings → Environments) — the iOS mirror of play-production.
  # No repo checkout needed: the job downloads the IPA artifact, re-writes
  # the ASC key from secrets, and uploads.
  upload-testflight:
    name: Publish to TestFlight (beta)
    needs: ios-release-build
    # Linux is enough: jq + fastlane + a network call — Android's
    # play-publish runs on ubuntu-24.04 too, and macOS minutes bill at 10x.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # contents: read is the minimum grant that lets the gate assertion
    # below call the environments API with github.token.
    permissions:
      contents: read
    environment:
      name: testflight
      # ASC TestFlight tab for Fenzit (app id 6838286809).
      url: https://appstoreconnect.apple.com/apps/6838286809/testflight
    steps:
      # The approval gate lives in repo settings, outside this file. If the
      # environment is deleted, GitHub silently auto-creates it with NO
      # protection and this job would run without ever waiting for review —
      # so assert the reviewers before uploading.
      - name: Assert testflight environment is review-gated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RULES="$(gh api "repos/$GITHUB_REPOSITORY/environments/testflight" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')" \
            || { echo "::warning::could not read testflight environment settings — verify the approval gate in Settings → Environments before trusting this upload"; exit 0; }
          if [ "$RULES" -lt 1 ]; then
            echo "::error::testflight environment has no required reviewers — the approval gate is gone. Re-add it in Settings → Environments before uploading."
            exit 1
          fi
          echo "testflight environment gated by $RULES required reviewer(s)"

      - name: Download release IPA
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-ipa
          path: ipa

      - name: Download TestFlight changelog
        uses: actions/download-artifact@v8.0.2
        with:
          name: testflight-changelog
          path: changelog

      - name: Write App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.FENZIT_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.FENZIT_ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.FENZIT_ASC_KEY_P8 }}
        run: |
          for v in "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$ASC_KEY_P8"; do
            [ -n "$v" ] || { echo "::error::missing secret — need FENZIT_ASC_KEY_ID, FENZIT_ASC_ISSUER_ID, FENZIT_ASC_KEY_P8"; exit 1; }
          done
          mkdir -p build
          printf '%s' "$ASC_KEY_P8" > "build/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "build/AuthKey_${ASC_KEY_ID}.p8"
          jq -n \
            --arg key_id "$ASC_KEY_ID" \
            --arg issuer_id "$ASC_ISSUER_ID" \
            --arg key "$ASC_KEY_P8" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > build/asc_key.json
          chmod 600 build/asc_key.json

      # fastlane ships on the macOS runner image but not on ubuntu — the gem
      # install always runs here. skip_waiting_for_build_processing: Apple's
      # processing queue runs 10-30 min — the runner must not bill minutes
      # waiting on it. (Upload via the ASC API is Apple's supported CI path;
      # altool is deprecated for uploads.)
      - name: Upload to TestFlight
        run: |
          command -v fastlane >/dev/null 2>&1 || gem install fastlane --no-document
          IPA_FILE="$(ls ipa/*.ipa 2>/dev/null | head -1)"
          [ -n "$IPA_FILE" ] || { echo "::error::no .ipa in the release-ipa artifact"; exit 1; }
          fastlane pilot upload \
            --api_key_path build/asc_key.json \
            --ipa "$IPA_FILE" \
            --changelog "$(cat changelog/whats-new.txt)" \
            --skip_waiting_for_build_processing \
            --notify_external_testers false
