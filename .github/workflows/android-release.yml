name: Android release build

# Runs on every push to `release` — the intended flow is main → release via
# PR, so cut `release` from `main` and protect it against direct pushes.
on:
  push:
    branches: [release]
  # Lets an artifact be rebuilt for an old SHA (e.g. after retention expiry)
  # without an empty commit.
  workflow_dispatch:

# The release-publishing step tags and attaches APKs/AAB to GitHub Releases.
permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release-build:
    name: Release APKs + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # fetch-depth: 0 — verify:store scans store-v* tags, which a shallow
      # clone never sees.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The runner image ships ~25 GB of preinstalled tooling this pipeline
      # never uses (dotnet, Haskell, Boost, CodeQL, docker images). The
      # gradle cache restore, jest workers and the NDK-heavy release build
      # need that headroom — without it the run dies with ENOSPC mid-tests.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/chromium
          sudo docker image prune -af > /dev/null 2>&1 || true
          avail=$(df --output=avail -B1 / | tail -1)
          if [ "$avail" -lt $((20 * 1024 * 1024 * 1024)) ]; then
            echo "::error::only $avail bytes free after cleanup — cleanup paths may have moved on this runner image"
            exit 1
          fi
          df -h /

      # SkillIcon.catalog.test.ts reads the skills icon catalog straight from
      # the fenzit-be migration (the two repos cannot drift apart) — this
      # mirrors the local workspace shape (workspace/core/{frontend,backend}).
      # Two levels up: the test resolves __dirname up 5 to /home/runner/work
      # (the parent of the checkout dir), not to the checkout's parent.
      # The sibling is pinned to the commit in .fenzit-be-ref so an unrelated
      # backend push can't flip this gate — bump that file deliberately.
      - name: Check out sibling fenzit-be
        run: |
          : "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE unset}"
          PIN="$(grep -v '^#' "$GITHUB_WORKSPACE/.fenzit-be-ref" | head -1 | tr -d '[:space:]')"
          if [[ ! "$PIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.fenzit-be-ref must contain a 40-hex commit sha (got: '$PIN')"
            exit 1
          fi
          DEST="$GITHUB_WORKSPACE/../../backend/fenzit-be"
          rm -rf "$DEST"
          git init -q "$DEST"
          git -C "$DEST" fetch -q --depth 1 https://github.com/ashishkumar1000/fenzit-be.git "$PIN"
          git -C "$DEST" checkout -q FETCH_HEAD
          echo "fenzit-be pinned at $(git -C "$DEST" rev-parse HEAD)"
          BE_MAIN="$(git ls-remote https://github.com/ashishkumar1000/fenzit-be main | cut -f1)"
          if [ "$BE_MAIN" != "$PIN" ]; then
            echo "::warning::fenzit-be main ($BE_MAIN) has moved past the pin ($PIN) — the drift guard validates the pinned catalog; bump .fenzit-be-ref after intentional backend changes"
          fi

      # JDK 17 — required by android/gradle/gradle-daemon-jvm.properties
      # (JDK 26 breaks AGP's jlink transform). Gradle's daemon JVM criteria
      # match any installed JDK 17; the foojay resolver provisions one if
      # none exists. cache: gradle keeps the RN/AGP dependency caches warm.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The RN gradle plugin spawns `node` for Metro bundling; .nvmrc = 24.13.0.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Installs the version from package.json "packageManager" (bun@1.3.13).
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Deliberately no lint gate yet: the codebase predates its .eslintrc.js
      # and carries a 133-error backlog. Re-enable after cleaning that up.

      # `bun run test`, not `bun test` — bare bun test breaks on RN Flow types.
      # TZ from the environment: jest.setup.js's in-band pin cannot retrofit a
      # started Node process (V8 caches the zone — UTC runners rendered IST
      # wall clocks as UTC and failed the wall-clock assertions).
      - name: Tests
        run: bun run test
        env:
          TZ: Asia/Kolkata

      # Mirrors the .githooks/pre-commit gates — PR merges and --no-verify
      # commits reach `release` without ever running the hook.
      - name: Verify version sync
        run: bun run verify:version

      - name: Verify store version downgrade
        run: bun run verify:store

      # Signs with the release keystore tracked in the repo
      # (android/keystore.properties — pre-launch convention; rotate before any
      # public release) and fails the run if output is debug-signed.
      - name: Build release APKs (per-ABI)
        run: bun run android:build:release

      - name: Build release AAB
        run: bun run android:build:aab

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Publish the build as a GitHub Release tagged v<version> (version
      # sync is guaranteed by verify:version above). Idempotent per version:
      # a rebuild of the same version replaces the release's assets instead
      # of failing — no release spam across repeated runs of one version.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          STAGE="$(mktemp -d)"
          for f in android/app/build/outputs/apk/release/*.apk; do
            base="$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//')"
            cp "$f" "$STAGE/fenzit-$VERSION-$base.apk"
          done
          cp android/app/build/outputs/bundle/release/*.aab "$STAGE/fenzit-$VERSION.aab"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$STAGE"/*.apk "$STAGE"/*.aab --clobber
            # Drop assets a rebuild no longer produces (e.g. a retired ABI) —
            # --clobber alone would leave stale APKs downloadable.
            for a in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
              [ -f "$STAGE/$a" ] || gh release delete-asset "$TAG" "$a" -y
            done
          elif git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::tag $TAG exists but has no release — delete the tag or bump the version before publishing"
            exit 1
          else
            gh release create "$TAG" "$STAGE"/*.apk "$STAGE"/*.aab \
              --target "$GITHUB_SHA" --title "Fenzit $VERSION" --generate-notes
          fi
