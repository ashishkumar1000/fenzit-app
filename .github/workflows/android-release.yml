name: Android release build

# Runs on every push to `release` — the intended flow is main → release via
# PR, so cut `release` from `main` and protect it against direct pushes.
on:
  push:
    branches: [release]
  # Lets an artifact be rebuilt for an old SHA (e.g. after retention expiry)
  # without an empty commit.
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release-build:
    name: Release APKs + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # fetch-depth: 0 — verify:store scans store-v* tags, which a shallow
      # clone never sees.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The runner image ships ~25 GB of preinstalled tooling this pipeline
      # never uses (dotnet, Haskell, Boost, CodeQL, docker images). The
      # gradle cache restore, jest workers and the NDK-heavy release build
      # need that headroom — without it the run dies with ENOSPC mid-tests.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/chromium
          sudo docker image prune -af > /dev/null 2>&1 || true
          avail=$(df --output=avail -B1 / | tail -1)
          if [ "$avail" -lt $((20 * 1024 * 1024 * 1024)) ]; then
            echo "::error::only $avail bytes free after cleanup — cleanup paths may have moved on this runner image"
            exit 1
          fi
          df -h /

      # JDK 17 — required by android/gradle/gradle-daemon-jvm.properties
      # (JDK 26 breaks AGP's jlink transform). Gradle's daemon JVM criteria
      # match any installed JDK 17; the foojay resolver provisions one if
      # none exists. cache: gradle keeps the RN/AGP dependency caches warm.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The RN gradle plugin spawns `node` for Metro bundling; .nvmrc = 24.13.0.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Installs the version from package.json "packageManager" (bun@1.3.13).
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Deliberately no lint gate yet: the codebase predates its .eslintrc.js
      # and carries a 133-error backlog. Re-enable after cleaning that up.

      # `bun run test`, not `bun test` — bare bun test breaks on RN Flow types.
      # Advisory for now: pre-existing UI suites (RosterScreen on CI,
      # EmployeesStep locally) crash mid-test when a delayed useNativeDriver
      # animation fires — RN 0.87's jest env lacks the Fabric private API
      # (getNativeTagFromPublicInstance), so the crash is timing-sensitive:
      # invisible on fast machines, frequent under CI load. Failures still
      # show as a failed step; they stop blocking artifact builds until
      # jest.setup.js pins native-driver animations in tests.
      - name: Tests (advisory)
        run: bun run test
        continue-on-error: true

      # Mirrors the .githooks/pre-commit gates — PR merges and --no-verify
      # commits reach `release` without ever running the hook.
      - name: Verify version sync
        run: bun run verify:version

      - name: Verify store version downgrade
        run: bun run verify:store

      # Signs with the release keystore tracked in the repo
      # (android/keystore.properties — pre-launch convention; rotate before any
      # public release) and fails the run if output is debug-signed.
      - name: Build release APKs (per-ABI)
        run: bun run android:build:release

      - name: Build release AAB
        run: bun run android:build:aab

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
